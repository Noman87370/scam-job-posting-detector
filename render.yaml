# Render Blueprint — deploys the whole platform as one free web service
# plus a free Postgres database. Apply with `render blueprint` or by
# connecting the repo in the Render dashboard (see DEPLOYMENT.md).
#
# The model is NOT retrained at build time: the app loads the
# committed artifact model/model_artifacts.joblib (exported from the
# research notebook — see the README). That keeps deploys fast and the
# deployed model identical on every deploy.

services:
  - type: web
    name: scam-job-detector
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      cd frontend && npm install --no-audit --no-fund && npm run build && cd ..
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: RUN_SCHEDULER
        value: "true"
      - key: INGEST_INTERVAL_MINUTES
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: scam-jobs-db
          property: connectionString
      - key: INGEST_TOKEN
        generateValue: true

databases:
  - name: scam-jobs-db
    plan: free
