# Render Blueprint — deploys the whole platform as one free web service.
# Apply with `render blueprint` or by connecting the repo in the Render
# dashboard (see DEPLOYMENT.md).
#
# The model is NOT retrained at build time: the app loads the
# committed artifact model/model_artifacts.joblib (exported from the
# research notebook — see the README). That keeps deploys fast and the
# deployed model identical on every deploy.
#
# There is no database: the job feed is fetched server-side from the
# Arbeitnow API on demand and held in an in-memory cache (see
# backend/feed.py), so there is no databases section and no
# DATABASE_URL / INGEST_TOKEN / scheduler env vars.

services:
  - type: web
    name: scam-job-detector
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      cd frontend && npm install --no-audit --no-fund && npm run build && cd ..
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
