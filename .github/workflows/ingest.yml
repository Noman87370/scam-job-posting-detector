# Triggers ingestion from outside the web service every 30 minutes.
# Needed because free-tier hosts sleep: the POST wakes the service and
# the in-process scheduler also runs while it is awake.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   APP_URL       e.g. https://scam-job-detector-hob9.onrender.com (no trailing slash)
#   INGEST_TOKEN  must match the INGEST_TOKEN env var of the web service

name: Scheduled ingestion

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion
        run: |
          code=$(curl -s -o /tmp/ingest.json -w "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/jobs/ingest" \
            -H "X-Ingest-Token: ${{ secrets.INGEST_TOKEN }}")
          echo "HTTP $code"
          cat /tmp/ingest.json
          test "$code" = "200"
